<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Widget</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app" class="glass">
  <div class="sheen"></div>
  <div class="grain"></div>

  <header class="bar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <span class="title" data-tauri-drag-region>Claude Code</span>
      <span id="summary" class="summary" data-tauri-drag-region></span>
    </div>
    <div class="actions">
      <button id="pin" class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg></button>
      <button id="compact" class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="m14 10 7-7"/><path d="m3 21 7-7"/></svg></button>
      <button id="gear" class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg></button>
      <button id="close" class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
  </header>

  <section class="body">
    <article id="focus" class="focus pane"></article>
    <aside class="hub">
      <div class="hub-head"><span id="hub-title"></span><span id="hub-count" class="count"></span></div>
      <div id="list" class="list"></div>
    </aside>
  </section>

  <section id="pill" class="pill" data-tauri-drag-region></section>

  <section id="settings" class="settings" hidden>
    <h2 id="s-title"></h2>
    <p id="s-pair-hint" class="dim"></p>
    <div class="pair">
      <code id="pair-line"></code>
      <button id="copy" class="chip"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg><span id="copy-text"></span></button>
    </div>
    <div class="rows">
      <label class="row"><span id="s-notify"></span><input id="notify" type="checkbox"></label>
      <label class="row"><span id="s-look"></span>
        <select id="look"><option value="clear"></option><option value="frosted"></option></select>
      </label>
      <label class="row" id="tint-row"><span id="s-tint"></span><input id="tint" type="range" min="0" max="90" step="5"></label>
      <label class="row"><span id="s-lang"></span>
        <select id="lang"><option value="zh">繁體中文</option><option value="en">English</option></select>
      </label>
    </div>
    <div class="foot-row">
      <p id="s-privacy" class="dim small"></p>
      <button id="s-done" class="chip accent"></button>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>

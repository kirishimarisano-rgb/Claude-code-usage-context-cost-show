<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Widget</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app" class="glass">
  <div class="sheen"></div>

  <header class="bar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l1.6 6.1 5.6-3-3 5.6 6.1 1.6-6.1 1.6 3 5.6-5.6-3L12 21.5l-1.6-6.1-5.6 3 3-5.6L1.7 11.2l6.1-1.6-3-5.6 5.6 3z"/></svg>
      <span data-tauri-drag-region>Claude</span>
      <span id="summary" class="summary" data-tauri-drag-region></span>
    </div>
    <div class="actions">
      <button id="pin" class="icon" title=""><svg viewBox="0 0 16 16"><path d="M9.5 1.5l5 5-2 1-2.5 2.5.5 3-1.5 1.5-3-3L2 15.5 1.5 15 5.5 11l-3-3L4 6.5l3 .5L9.5 4.5z"/></svg></button>
      <button id="compact" class="icon" title=""><svg viewBox="0 0 16 16"><rect x="2" y="6" width="12" height="4" rx="2"/></svg></button>
      <button id="gear" class="icon" title=""><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
      <button id="close" class="icon" title=""><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
  </header>

  <section class="body">
    <article id="focus" class="focus"></article>
    <aside class="hub">
      <div class="hub-head"><span id="hub-title"></span><span id="hub-count" class="count"></span></div>
      <div id="list" class="list"></div>
    </aside>
  </section>

  <section id="pill" class="pill" data-tauri-drag-region></section>

  <section id="settings" class="settings" hidden>
    <h2 id="s-title"></h2>
    <p id="s-pair-hint" class="dim"></p>
    <div class="pair">
      <code id="pair-line"></code>
      <button id="copy" class="chip"></button>
    </div>
    <div class="rows">
      <label class="row"><span id="s-notify"></span><input id="notify" type="checkbox"></label>
      <label class="row"><span id="s-lang"></span>
        <select id="lang"><option value="zh">繁體中文</option><option value="en">English</option></select>
      </label>
      <div class="row"><span id="s-port"></span><span id="port" class="dim mono"></span></div>
    </div>
    <p id="s-privacy" class="dim small"></p>
    <button id="s-done" class="chip accent"></button>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>

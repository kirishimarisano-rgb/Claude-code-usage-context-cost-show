name: Claude Widget (Windows)

on:
  push:
    branches: [main]
    paths:
      - 'claude-widget/**'
      - '.github/workflows/widget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: claude-widget/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the installer
        working-directory: claude-widget
        run: npx -y @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v4
        with:
          name: claude-widget-windows
          path: claude-widget/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
